# Grafana stretcher — отдельный инстанс за секретным путём на true-scale.ru.
# Пароль админа задаётся через env GF_SECURITY_ADMIN_PASSWORD (/etc/stretcher/grafana.env).
[server]
root_url = https://true-scale.ru/***REMOVED***/
serve_from_sub_path = true
http_port = 3000

[security]
admin_user = admin
allow_embedding = false
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true

[users]
allow_sign_up = false
default_theme = dark

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
